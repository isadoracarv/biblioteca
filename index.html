<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Central</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <section class="container">
        <h2>Cadastro de Livros</h2>   
        
        <form action="#">
            <div class="cadastro">
                <label for="nome">Título:</label>
                <input type="text" placeholder="Digite o título..." >
            </div>
            
            <div class="cadastro">
                <label for="nome">Autor:</label>
                <input type="text" placeholder="Digite o nome do autor..." >
            </div>
            
            <div class="cadastro">
                <label for="nome">Ano de Publicação:</label>
                <input type="text" placeholder="Digite o ano de publicação..." >
            </div>

            <button id="btn">Cadastrar</button>
        </form>
    </section>

    <script src="script.js"></script>

</body>
</html>
